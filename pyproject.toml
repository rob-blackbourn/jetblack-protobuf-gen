[project]
name = "protobuf-ex1"
version = "0.1.0"
description = "Let's go psycho!"
authors = [{name = "Rob Blackbourn", email = "rob.blackbourn@gmail.com"}]
readme = "README.md"
dependencies = [
    "protobuf",
]

[project.optional-dependencies]
dev = [
    "mypy",
    "types-protobuf",
    "debugpy",
]

[project.scripts]
protoc-gen-jetpy = "protobuf_ex1.plugin:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
